name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # ── 1. Build all packages ────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:coverage

      - run: npm run build

      - name: Upload npm dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-npm
          path: packages/npm/dist/

      - name: Upload gh dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-gh
          path: packages/gh/dist/

      - name: Upload bp dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-bp
          path: packages/bp/dist/

      - name: Upload osv dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-osv
          path: packages/osv/dist/

      - name: Upload dh dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-dh
          path: packages/dh/dist/

      - name: Upload pypi dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-pypi
          path: packages/pypi/dist/

      - name: Upload packagist dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-packagist
          path: packages/packagist/dist/

      - name: Upload maven dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-maven
          path: packages/maven/dist/

      - name: Upload nuget dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-nuget
          path: packages/nuget/dist/

      - name: Upload crates dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-crates
          path: packages/crates/dist/

      - name: Upload pkggo dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-pkggo
          path: packages/pkggo/dist/

  # ── 2a. Release @api-hooks/npm ────────────────────────────────────────────
  release-npm:
    name: Release @api-hooks/npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download npm dist
        uses: actions/download-artifact@v4
        with:
          name: dist-npm
          path: packages/npm/dist/

      - name: Release
        working-directory: packages/npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ── 2b. Release @api-hooks/gh ─────────────────────────────────────────────
  release-gh:
    name: Release @api-hooks/gh
    needs: release-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download gh dist
        uses: actions/download-artifact@v4
        with:
          name: dist-gh
          path: packages/gh/dist/

      - name: Release
        working-directory: packages/gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ── 2c. Release @api-hooks/bp ─────────────────────────────────────────────
  release-bp:
    name: Release @api-hooks/bp
    needs: release-gh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download bp dist
        uses: actions/download-artifact@v4
        with:
          name: dist-bp
          path: packages/bp/dist/

      - name: Release
        working-directory: packages/bp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ── 2d. Release @api-hooks/osv ────────────────────────────────────────────
  release-osv:
    name: Release @api-hooks/osv
    needs: release-bp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download osv dist
        uses: actions/download-artifact@v4
        with:
          name: dist-osv
          path: packages/osv/dist/

      - name: Release
        working-directory: packages/osv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ── 2e. Release @api-hooks/dh ─────────────────────────────────────────────
  release-dh:
    name: Release @api-hooks/dh
    needs: release-osv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download dh dist
        uses: actions/download-artifact@v4
        with:
          name: dist-dh
          path: packages/dh/dist/

      - name: Release
        working-directory: packages/dh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ── 2f. Release @api-hooks/pypi ───────────────────────────────────────────
  release-pypi:
    name: Release @api-hooks/pypi
    needs: release-dh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download pypi dist
        uses: actions/download-artifact@v4
        with:
          name: dist-pypi
          path: packages/pypi/dist/

      - name: Release
        working-directory: packages/pypi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ── 2g. Release @api-hooks/packagist ─────────────────────────────────────
  release-packagist:
    name: Release @api-hooks/packagist
    needs: release-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download packagist dist
        uses: actions/download-artifact@v4
        with:
          name: dist-packagist
          path: packages/packagist/dist/

      - name: Release
        working-directory: packages/packagist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ── 2h. Release @api-hooks/maven ──────────────────────────────────────────
  release-maven:
    name: Release @api-hooks/maven
    needs: release-packagist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download maven dist
        uses: actions/download-artifact@v4
        with:
          name: dist-maven
          path: packages/maven/dist/

      - name: Release
        working-directory: packages/maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ── 2i. Release @api-hooks/nuget ──────────────────────────────────────────
  release-nuget:
    name: Release @api-hooks/nuget
    needs: release-maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download nuget dist
        uses: actions/download-artifact@v4
        with:
          name: dist-nuget
          path: packages/nuget/dist/

      - name: Release
        working-directory: packages/nuget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ── 2j. Release @api-hooks/crates ─────────────────────────────────────────
  release-crates:
    name: Release @api-hooks/crates
    needs: release-nuget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download crates dist
        uses: actions/download-artifact@v4
        with:
          name: dist-crates
          path: packages/crates/dist/

      - name: Release
        working-directory: packages/crates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ── 2k. Release @api-hooks/pkggo ──────────────────────────────────────────
  release-pkggo:
    name: Release @api-hooks/pkggo
    needs: release-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:

name: Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate docs
        run: npm run docs --workspaces --if-present

      - name: Assemble site
        run: |
          mkdir -p _site/npm _site/gh _site/bp _site/osv _site/dh _site/pypi _site/packagist _site/maven _site/nuget _site/crates _site/pkggo _site/pub _site/hex
          cp -r packages/npm/docs/. _site/npm/
          cp -r packages/gh/docs/.  _site/gh/
          cp -r packages/bp/docs/.  _site/bp/
          cp -r packages/osv/docs/. _site/osv/
          cp -r packages/dh/docs/.  _site/dh/
          cp -r packages/pypi/docs/. _site/pypi/
          cp -r packages/packagist/docs/. _site/packagist/
          cp -r packages/maven/docs/. _site/maven/
          cp -r packages/nuget/docs/. _site/nuget/
          cp -r packages/crates/docs/. _site/crates/
          cp -r packages/pkggo/docs/. _site/pkggo/
          cp -r packages/pub/docs/. _site/pub/
          cp -r packages/hex/docs/. _site/hex/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
